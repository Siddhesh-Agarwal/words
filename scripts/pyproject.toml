[project]
name = "words-data"
version = "0.1.0"
description = "Offline data generators and validators for the words games"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29.1",
    "ujson>=6.1.0",
]

[project.scripts]
words-data = "words_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["words_data"]
